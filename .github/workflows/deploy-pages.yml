name: Deploy RecruitFlow Business Tower and apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          git archive --format=tar HEAD | tar -x -C _site

          # Preserve the separate Seconds Agents application when its package exists.
          if compgen -G ".deploy/seconds-agents.b64.*" > /dev/null; then
            mkdir -p _site/seconds-agents
            cat .deploy/seconds-agents.b64.* | base64 --decode > /tmp/seconds-agents.zip
            unzip -q -o /tmp/seconds-agents.zip -d _site/seconds-agents
          fi

          # Recover the application from the historical package, including the
          # readable part of its truncated final entry for source reconstruction.
          if [[ -f ".deploy/control-postari-agenti.zip" ]]; then
            rm -rf _site/control-postari-agenti
            python .github/scripts/recover_local_zip.py \
              .deploy/control-postari-agenti.zip \
              _site/control-postari-agenti \
              --allow-partial \
              --require index.html \
              --require styles.css \
              --require app.js
          fi

          rm -rf _site/.git _site/.github _site/.deploy
          rm -f _site/seconds-agents-package.zip

          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/src/main.js
          test -s _site/src/data.js
          grep -q "RecruitFlow Business Tower" _site/index.html
          grep -q "class BusinessTower3D" _site/src/main.js
          grep -q "businessFloors" _site/src/data.js

          if [[ -f ".deploy/control-postari-agenti.zip" ]]; then
            test -s _site/control-postari-agenti/index.html
            test -s _site/control-postari-agenti/styles.css
            test -s _site/control-postari-agenti/app.js
            test -s _site/control-postari-agenti/recovery-report.json
            grep -q "Control Postări Agenți" _site/control-postari-agenti/index.html
            grep -q "pc_posts" _site/control-postari-agenti/app.js
          fi

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Business Tower
        shell: bash
        env:
          ROOT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            index="$(curl -fsSL --max-time 20 "$ROOT_URL" || true)"
            main="$(curl -fsSL --max-time 20 "${ROOT_URL}src/main.js" || true)"
            data="$(curl -fsSL --max-time 20 "${ROOT_URL}src/data.js" || true)"
            if grep -q "RecruitFlow Business Tower" <<<"$index" \
              && grep -q "class BusinessTower3D" <<<"$main" \
              && grep -q "businessFloors" <<<"$data"; then
              echo "Business Tower is live and verified at $ROOT_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Public verification failed for $ROOT_URL" >&2
          exit 1

      - name: Verify Control Postări Agenți
        if: ${{ hashFiles('.deploy/control-postari-agenti.zip') != '' }}
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}control-postari-agenti/
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            index="$(curl -fsSL --max-time 20 "$PUBLIC_URL" || true)"
            app="$(curl -fsSL --max-time 20 "${PUBLIC_URL}app.js" || true)"
            styles="$(curl -fsSL --max-time 20 "${PUBLIC_URL}styles.css" || true)"
            report="$(curl -fsSL --max-time 20 "${PUBLIC_URL}recovery-report.json" || true)"
            if grep -q "Control Postări Agenți" <<<"$index" \
              && grep -q "pc_posts" <<<"$app" \
              && grep -q "auth-shell" <<<"$styles" \
              && grep -q "partial_entries" <<<"$report"; then
              echo "Control Postări Agenți recovery preview is live at $PUBLIC_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Control Postări Agenți recovery preview verification failed for $PUBLIC_URL" >&2
          exit 1

      - name: Verify optional Seconds Agents app
        if: ${{ hashFiles('.deploy/seconds-agents.b64.*') != '' }}
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}seconds-agents/
        run: |
          set -euo pipefail
          index="$(curl -fsSL --max-time 20 "$PUBLIC_URL" || true)"
          app="$(curl -fsSL --max-time 20 "${PUBLIC_URL}app.js" || true)"
          grep -q "Seconds Agents" <<<"$index"
          grep -q "seconds-agents:data:v1" <<<"$app"

      - name: Mark verified deployment
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/business-tower-live"
