name: Deploy RecruitFlow Business Tower and apps

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare and validate site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          git archive --format=tar HEAD | tar -x -C _site

          # Preserve the separate Seconds Agents application when its package exists.
          if compgen -G ".deploy/seconds-agents.b64.*" > /dev/null; then
            mkdir -p _site/seconds-agents
            cat .deploy/seconds-agents.b64.* | base64 --decode > /tmp/seconds-agents.zip
            unzip -q -o /tmp/seconds-agents.zip -d _site/seconds-agents
          fi

          # Rebuild Control Postări Agenți from verified deterministic chunks.
          if ! compgen -G ".deploy/control-postari-v2.b64.*" > /dev/null; then
            echo "Control Postări v2 package is missing" >&2
            exit 1
          fi
          cat .deploy/control-postari-v2.b64.* | base64 --decode > /tmp/control-postari-v2.tar.gz
          echo "14b4afefec963be9e1fd010383a124adca1ceed9fdbe2f46eca837bb3aa482f3  /tmp/control-postari-v2.tar.gz" | sha256sum -c -
          rm -rf _site/control-postari-agenti
          mkdir -p _site/control-postari-agenti
          tar -xzf /tmp/control-postari-v2.tar.gz -C _site/control-postari-agenti

          # Keep the browser client deterministic instead of following a moving major-version URL.
          sed -i 's#@supabase/supabase-js@2/+esm#@supabase/supabase-js@2.112.4/+esm#' _site/control-postari-agenti/app.js

          # Temporary direct guest mode plus photo upload: the original package stays unchanged.
          cp control-postari-agenti/guest-supabase.js _site/control-postari-agenti/guest-supabase.js
          cp control-postari-agenti/photo-upload.js _site/control-postari-agenti/photo-upload.js
          cp control-postari-agenti/photo-upload.css _site/control-postari-agenti/photo-upload.css
          python3 control-postari-agenti/enable-guest-ui.py _site/control-postari-agenti/index.html

          rm -rf _site/.git _site/.github _site/.deploy
          rm -f _site/seconds-agents-package.zip

          # Validate Business Tower.
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/src/main.js
          test -s _site/src/data.js
          grep -q "RecruitFlow Business Tower" _site/index.html
          grep -q "class BusinessTower3D" _site/src/main.js
          grep -q "businessFloors" _site/src/data.js

          # Validate Control Postări Agenți before publishing.
          test -s _site/control-postari-agenti/index.html
          test -s _site/control-postari-agenti/styles.css
          test -s _site/control-postari-agenti/app.js
          test -s _site/control-postari-agenti/guest-supabase.js
          test -s _site/control-postari-agenti/photo-upload.js
          test -s _site/control-postari-agenti/photo-upload.css
          grep -q "Control Postări Agenți" _site/control-postari-agenti/index.html
          grep -q "Acces deschis" _site/control-postari-agenti/index.html
          grep -q "guest-supabase.js" _site/control-postari-agenti/index.html
          grep -q "photo-upload.js" _site/control-postari-agenti/index.html
          grep -q "photo-upload.css" _site/control-postari-agenti/index.html
          grep -q "auth-view" _site/control-postari-agenti/styles.css
          grep -q "pc_posts" _site/control-postari-agenti/app.js
          grep -q "sb_publishable_" _site/control-postari-agenti/app.js
          grep -q "@supabase/supabase-js@2.112.4/+esm" _site/control-postari-agenti/app.js
          grep -q "GUEST_ID" _site/control-postari-agenti/guest-supabase.js
          grep -q "PHOTO_BUCKET = 'control-postari-dovezi'" _site/control-postari-agenti/photo-upload.js
          grep -q "data-photo-file" _site/control-postari-agenti/photo-upload.js
          grep -q "photo-upload-card" _site/control-postari-agenti/photo-upload.css
          cp _site/control-postari-agenti/app.js /tmp/control-postari-app.mjs
          cp _site/control-postari-agenti/guest-supabase.js /tmp/control-postari-guest.mjs
          cp _site/control-postari-agenti/photo-upload.js /tmp/control-postari-photo.mjs
          node --check /tmp/control-postari-app.mjs
          node --check /tmp/control-postari-guest.mjs
          node --check /tmp/control-postari-photo.mjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Business Tower
        shell: bash
        env:
          ROOT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            index="$(curl -fsSL --max-time 20 "$ROOT_URL" || true)"
            main="$(curl -fsSL --max-time 20 "${ROOT_URL}src/main.js" || true)"
            data="$(curl -fsSL --max-time 20 "${ROOT_URL}src/data.js" || true)"
            if grep -q "RecruitFlow Business Tower" <<<"$index" \
              && grep -q "class BusinessTower3D" <<<"$main" \
              && grep -q "businessFloors" <<<"$data"; then
              echo "Business Tower is live and verified at $ROOT_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Public verification failed for $ROOT_URL" >&2
          exit 1

      - name: Verify public Control Postări Agenți
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}control-postari-agenti/
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            index="$(curl -fsSL --max-time 20 "$PUBLIC_URL" || true)"
            app="$(curl -fsSL --max-time 20 "${PUBLIC_URL}app.js" || true)"
            guest="$(curl -fsSL --max-time 20 "${PUBLIC_URL}guest-supabase.js" || true)"
            photo="$(curl -fsSL --max-time 20 "${PUBLIC_URL}photo-upload.js" || true)"
            photo_css="$(curl -fsSL --max-time 20 "${PUBLIC_URL}photo-upload.css" || true)"
            styles="$(curl -fsSL --max-time 20 "${PUBLIC_URL}styles.css" || true)"
            if grep -q "Control Postări Agenți" <<<"$index" \
              && grep -q "Acces deschis" <<<"$index" \
              && grep -q "guest-supabase.js" <<<"$index" \
              && grep -q "photo-upload.js" <<<"$index" \
              && grep -q "photo-upload.css" <<<"$index" \
              && grep -q "auth-view" <<<"$styles" \
              && grep -q "pc_posts" <<<"$app" \
              && grep -q "sb_publishable_" <<<"$app" \
              && grep -q "@supabase/supabase-js@2.112.4/+esm" <<<"$app" \
              && grep -q "GUEST_ID" <<<"$guest" \
              && grep -q "control-postari-dovezi" <<<"$photo" \
              && grep -q "data-photo-file" <<<"$photo" \
              && grep -q "photo-upload-card" <<<"$photo_css"; then
              echo "Control Postări Agenți photo upload is live and verified at $PUBLIC_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Control Postări Agenți public verification failed for $PUBLIC_URL" >&2
          exit 1

      - name: Verify optional Seconds Agents app
        if: ${{ hashFiles('.deploy/seconds-agents.b64.*') != '' }}
        shell: bash
        env:
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}seconds-agents/
        run: |
          set -euo pipefail
          index="$(curl -fsSL --max-time 20 "$PUBLIC_URL" || true)"
          app="$(curl -fsSL --max-time 20 "${PUBLIC_URL}app.js" || true)"
          grep -q "Seconds Agents" <<<"$index"
          grep -q "seconds-agents:data:v1" <<<"$app"

      - name: Mark verified deployment
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin "HEAD:refs/heads/business-tower-live"
