name: Deploy Andrei Business World 3D

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          git archive --format=tar HEAD | tar -x -C _site
          mkdir -p _site/seconds-agents
          cat .deploy/seconds-agents.b64.* | base64 --decode > /tmp/seconds-agents.zip
          unzip -q -o /tmp/seconds-agents.zip -d _site/seconds-agents
          rm -rf _site/.git _site/.github _site/.deploy
          rm -f _site/seconds-agents-package.zip

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
