<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><meta name="description" content="Company Control Center — toate problemele, proiectele și sistemele companiei într-un singur dashboard."><title>Company Control Center — Andrei Alexandru</title><style>html,body{margin:0;min-height:100%;background:#07101f;color:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.box{max-width:520px}.spinner{width:48px;height:48px;border:4px solid #243853;border-top-color:#3ad7d1;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{color:#9aabc2}</style></head><body><div class="loading"><div class="box"><div class="spinner"></div><h1>Company Control Center</h1><p>Se încarcă aplicația companiei…</p></div></div><noscript>Activează JavaScript pentru a deschide aplicația.</noscript><script>(async()=>{try{const f=["payload-00.txt","payload-01.txt","payload-02.txt","payload-03.txt","payload-04.txt","payload-05.txt","payload-06.txt"],b=(await Promise.all(f.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Fișier '+x+': '+r.status);return r.text()})))).join(''),a=Uint8Array.from(atob(b),c=>c.charCodeAt(0)),d=new DecompressionStream('gzip'),t=await new Response(new Blob([a]).stream().pipeThrough(d)).text();document.open();document.write(t);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="loading"><div class="box"><h1>Aplicația nu s-a putut încărca</h1><p>Reîncarcă pagina într-un browser actualizat.</p></div></div>'}})();</script></body></html>
