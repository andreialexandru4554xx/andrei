<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecruitFlow Job Board</title><link rel="stylesheet" href="style.css"></head><body><header><div><b>RecruitFlow</b><span> JOB BOARD</span></div><button id="addBtn">+ Postează job</button></header><main><section class="hero"><h1>Joburi. Claim. Om găsit. Gata.</h1><p>Introdu jobul manual sau lipește textul brut al anunțului. Echipa îl poate revendica și marca atunci când a găsit muncitorul.</p><div class="stats"><div><strong id="sOpen">0</strong><small>OPEN</small></div><div><strong id="sClaim">0</strong><small>CLAIMED</small></div><div><strong id="sFilled">0</strong><small>FOUND</small></div></div></section><section class="toolbar"><input id="search" placeholder="Caută trade, locație, postcode, companie…"><select id="filter"><option value="">Toate</option><option value="open">Open</option><option value="claimed">Claimed</option><option value="filled">Found</option></select></section><section id="jobs" class="grid"></section></main><dialog id="modal"><form id="form"><button type="button" class="x" id="close">×</button><h2>Postează un job</h2><label>Text brut / copy-paste<textarea name="source_text" placeholder="Lipește aici anunțul complet…"></textarea></label><div class="two"><label>Meserie*<input name="trade" required></label><label>Locație*<input name="location" required></label><label>Postcode<input name="postcode"></label><label>Rate<input name="rate" placeholder="£220/day"></label><label>Companie<input name="company_name"></label><label>Contact<input name="contact_name"></label><label>Telefon<input name="contact_phone"></label><label>Nr. muncitori<input name="workers_needed" type="number" min="1" value="1"></label><label>Start<input name="start_date" type="date"></label></div><label>Detalii<textarea name="description"></textarea></label><button class="primary">Publică jobul</button></form></dialog><script src="app.js"></script></body></html>
